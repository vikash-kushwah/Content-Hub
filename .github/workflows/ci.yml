# CI — runs on every push/PR to main.
# NOTE: This is a code quality workflow, not the GitHub sync mechanism.
# Automatic GitHub sync is handled by scripts/post-merge.sh which runs
# after every Replit task merge and pushes HEAD to this repository.
# Replit is the source of truth; GitHub is a read-only backup mirror.
# Force-push may occur when Replit checkpoint commits diverge from prior
# task-agent direct pushes — this is expected and intentional.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck
