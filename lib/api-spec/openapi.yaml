openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Technical Tutorial Hub
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Blog posts and tutorials
  - name: newsletter
    description: Newsletter subscriptions
  - name: feedback
    description: Post feedback
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List all posts
      description: Returns all blog posts, tutorials and how-to guides
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [blog, tutorial, how-to]
          description: Filter by category
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filter by tag
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Max number of posts
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostSummary"
                  total:
                    type: integer
                required:
                  - posts
                  - total
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/featured:
    get:
      operationId: getFeaturedPosts
      tags: [posts]
      summary: Get featured posts
      description: Returns featured/pinned posts for the homepage
      responses:
        "200":
          description: Featured posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostSummary"
                required:
                  - posts

  /posts/recent:
    get:
      operationId: getRecentPosts
      tags: [posts]
      summary: Get recent posts
      description: Returns the most recently published posts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 6
      responses:
        "200":
          description: Recent posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostSummary"
                required:
                  - posts

  /posts/stats:
    get:
      operationId: getPostsStats
      tags: [posts]
      summary: Get content statistics
      description: Returns stats like total posts, categories breakdown, popular tags
      responses:
        "200":
          description: Content statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentStats"

  /posts/{slug}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a single post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{slug}/related:
    get:
      operationId: getRelatedPosts
      tags: [posts]
      summary: Get related posts
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Related posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostSummary"
                required:
                  - posts

  /posts/{slug}/navigation:
    get:
      operationId: getPostNavigation
      tags: [posts]
      summary: Get previous and next posts
      description: Returns the post published immediately before and after the given slug, ordered by publishedAt
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Adjacent posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostNavigation"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{slug}/update:
    put:
      operationId: updatePost
      tags: [posts]
      summary: Update an existing post
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{slug}/delete:
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Post deleted
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/subscribers:
    get:
      operationId: listSubscribers
      tags: [newsletter]
      summary: List all newsletter subscribers
      responses:
        "200":
          description: List of subscribers
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscriber"
                  total:
                    type: integer
                required:
                  - subscribers
                  - total

  /newsletter/subscribers/{id}:
    delete:
      operationId: deleteSubscriber
      tags: [newsletter]
      summary: Delete a subscriber
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Subscriber deleted
        "404":
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeBody"
      responses:
        "201":
          description: Subscribed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscribeResponse"
        "409":
          description: Already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit post feedback (was this helpful?)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackBody"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PostSummary:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        category:
          type: string
          enum: [blog, tutorial, how-to]
        tags:
          type: array
          items:
            type: string
        readingTimeMinutes:
          type: integer
        publishedAt:
          type: string
          format: date-time
        featured:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
          nullable: true
      required:
        - id
        - slug
        - title
        - excerpt
        - category
        - tags
        - readingTimeMinutes
        - publishedAt
        - featured

    Post:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        category:
          type: string
          enum: [blog, tutorial, how-to]
        tags:
          type: array
          items:
            type: string
        readingTimeMinutes:
          type: integer
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        featured:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
          nullable: true
        tableOfContents:
          type: array
          items:
            $ref: "#/components/schemas/TocItem"
        series:
          type: string
          nullable: true
        seriesOrder:
          type: integer
          nullable: true
        affiliateLinks:
          type: array
          items:
            $ref: "#/components/schemas/AffiliateLink"
        helpfulCount:
          type: integer
        notHelpfulCount:
          type: integer
      required:
        - id
        - slug
        - title
        - excerpt
        - content
        - category
        - tags
        - readingTimeMinutes
        - publishedAt
        - featured
        - tableOfContents
        - affiliateLinks
        - helpfulCount
        - notHelpfulCount

    TocItem:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        level:
          type: integer
      required:
        - id
        - text
        - level

    AffiliateLink:
      type: object
      properties:
        label:
          type: string
        url:
          type: string
        description:
          type: string
          nullable: true
      required:
        - label
        - url

    ContentStats:
      type: object
      properties:
        totalPosts:
          type: integer
        byCategory:
          type: object
          additionalProperties:
            type: integer
        popularTags:
          type: array
          items:
            type: object
            properties:
              tag:
                type: string
              count:
                type: integer
            required:
              - tag
              - count
        totalSubscribers:
          type: integer
      required:
        - totalPosts
        - byCategory
        - popularTags
        - totalSubscribers

    NewsletterSubscribeBody:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
      required:
        - email

    NewsletterSubscribeResponse:
      type: object
      properties:
        message:
          type: string
        alreadySubscribed:
          type: boolean
      required:
        - message
        - alreadySubscribed

    FeedbackBody:
      type: object
      properties:
        postSlug:
          type: string
        helpful:
          type: boolean
      required:
        - postSlug
        - helpful

    FeedbackResponse:
      type: object
      properties:
        message:
          type: string
        helpfulCount:
          type: integer
        notHelpfulCount:
          type: integer
      required:
        - message
        - helpfulCount
        - notHelpfulCount

    PostNavigation:
      type: object
      properties:
        prev:
          allOf:
            - $ref: "#/components/schemas/PostSummary"
          nullable: true
        next:
          allOf:
            - $ref: "#/components/schemas/PostSummary"
          nullable: true
      required:
        - prev
        - next

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Subscriber:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        subscribedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - subscribedAt

    CreatePostBody:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        category:
          type: string
          enum: [blog, tutorial, how-to]
        tags:
          type: array
          items:
            type: string
        readingTimeMinutes:
          type: integer
        featured:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
          nullable: true
        series:
          type: string
          nullable: true
        seriesOrder:
          type: integer
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - slug
        - title
        - excerpt
        - content
        - category

    UpdatePostBody:
      type: object
      properties:
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        category:
          type: string
          enum: [blog, tutorial, how-to]
        tags:
          type: array
          items:
            type: string
        readingTimeMinutes:
          type: integer
        featured:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
          nullable: true
        series:
          type: string
          nullable: true
        seriesOrder:
          type: integer
          nullable: true
