kind = "web"
previewPath = "/"
title = "Technical Tutorial Hub"
version = "1.0.0"
id = "artifacts/tutorial-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22431

[services.development]
run = "pnpm --filter @workspace/tutorial-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tutorial-hub", "run", "build" ]
publicDir = "artifacts/tutorial-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22431"
BASE_PATH = "/"
